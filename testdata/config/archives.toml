title = "gitleaks config"
# https://learnxinyminutes.com/docs/toml/ for toml reference

prefilter = '''filter.matchesAny(attributes["path"], [`\.env\.prod$`])'''

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]

# This rule would match a password inside an archive.
[[rules]]
id = 'password'
description = "Find the DB password in .env.prod"
path = '''\.env\.prod$'''
regex = '''(?i)password=([^\s]+)'''
