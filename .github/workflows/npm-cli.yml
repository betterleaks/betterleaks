name: npm CLI

on:
  pull_request:
    paths:
      - 'bindings/node/**'
      - '.github/workflows/npm-cli.yml'
      - '.github/workflows/release.yml'
      - '.goreleaser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
        with:
          version: '~> v2'
          args: build --snapshot --clean
      - run: npm --prefix bindings/node run pack:cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-cli
          path: |
            dist/npm/*/*.tgz
            dist/metadata.json
          if-no-files-found: error
          compression-level: 0

  install:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-cli
          path: dist
      - run: npm --prefix bindings/node run test:pack
